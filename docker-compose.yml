# DEV ONLY — Do NOT use these credentials or exposed ports in production.
# Production: use strong passwords via env vars, remove host port bindings,
# add Redis requirepass, and put services behind a private network.
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: election_tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASS:-password123}
      POSTGRES_DB: ${DB_NAME:-election_tracker}
      ET_DB_INIT_ARGS: ${ET_DB_INIT_ARGS:-}
    ports:
      - "5432:5432"  # DEV ONLY — remove in production
    volumes:
      # First boot of an empty volume runs database/setup.sh (schema → migrations → seeds).
      # Set ET_DB_INIT_ARGS=--schema-only to skip seed data. Existing volumes are untouched:
      # re-run `database/setup.sh` against them instead (it is idempotent).
      - ./database:/database:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/10-setup.sh:ro
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: election_tracker_redis
    restart: always
    ports:
      - "6379:6379"  # DEV ONLY — remove in production, add requirepass

  otel-collector:
    # Pinned (latest release on Docker Hub as of 2026-09-25); verified to start with
    # otel-collector-config.yaml. Bump deliberately rather than tracking :latest.
    image: signoz/signoz-otel-collector:v0.144.12
    container_name: election_tracker_otel
    restart: always
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml
    environment:
      - SIGNOZ_ENDPOINT=${SIGNOZ_ENDPOINT:-ingest.us.signoz.cloud:443}
      - SIGNOZ_INGESTION_KEY=${SIGNOZ_INGESTION_KEY}
    command: ["--config", "/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  postgres_data:
