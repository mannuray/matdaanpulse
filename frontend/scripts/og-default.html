<!doctype html>
<html><head><meta charset="utf-8" /><style>

  .wrap { box-sizing: border-box; height: 100%; padding: 80px 96px; display: flex; flex-direction: column; justify-content: center; gap: 28px;

  .mark img { width: 112px; height: 112px; }
  .name { font-size: 88px; font-weight: 800; letter-spacing: -1px; }
  .name b { color: #FF7A1A; }
  .tag { font-size: 40px; opacity: .85; max-width: 960px; line-height: 1.25; }
</style></head>
<body><div class="wrap">
  <div class="mark"><img src="../public/logo-mark.png" alt="" /><div class="name">Matdaan<b>Pulse</b></div></div>
  <div class="tag">Live election results, constituency maps &amp; seat history for India</div>
</div></body></html>
