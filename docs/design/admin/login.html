<body class="bg-slate-50 font-body text-slate-900 antialiased min-h-screen flex items-center justify-center p-6 selection:bg-indigo-100 selection:text-indigo-900">
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- Centered Login Card -->
<div class="w-full bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
<!-- Card Header -->
<header class="mb-6 flex flex-col items-start">
<div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center text-white mb-4 shadow-sm">
<svg class="w-6 h-6 stroke-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<path d="M9 12l2 2 4-4"></path>
<rect height="16" rx="2" width="18" x="3" y="4"></rect>
</svg>
</div>
<h1 class="font-headline text-xl font-semibold text-slate-900 tracking-tight">MatdaanPulse Admin</h1>
<p class="text-sm text-slate-500 mt-1 font-normal">Sign in to manage elections and live results</p>
</header>
<!-- Authentication Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5" for="email">Email</label>
<input autocomplete="email" class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition-colors" id="email" name="email" placeholder="you@matdaanpulse.in" required="" type="email">
</div>
<!-- Password Field -->
<div>
<label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">Password</label>
<div class="relative">
<input autocomplete="current-password" class="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 pr-10 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition-colors" id="password" name="password" required="" type="password" value="••••••••••••">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none" id="toggle-password" type="button">
<svg class="w-5 h-5" fill="none" id="eye-icon" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 flex items-center justify-center rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm py-2.5 px-4 shadow-sm transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2" type="submit">
          Sign in
        </button>
</form>
<!-- Inline Error Banner -->
<div class="mt-4 rounded-lg bg-rose-50 border border-rose-200 px-3 py-2 text-xs text-rose-700 flex items-center gap-2">
<svg class="w-4 h-4 text-rose-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"></circle>
<line stroke-linecap="round" stroke-linejoin="round" x1="12" x2="12" y1="8" y2="12"></line>
<line stroke-linecap="round" stroke-linejoin="round" x1="12" x2="12.01" y1="16" y2="16"></line>
</svg>
<span>Invalid email or password</span>
</div>
</div>
<!-- Below Card Helper Text -->
<p class="mt-6 text-xs text-slate-400 text-center tracking-normal">
      Admin access only · accounts are created by a super admin
    </p>
</main>
<script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('toggle-password');
